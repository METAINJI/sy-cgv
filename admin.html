<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>관리자 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script>try{var m=localStorage.getItem("theme");document.documentElement.dataset.theme=m==="dark"||m==="light"?m:matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"}catch(e){}</script>
<style>
:root{color-scheme:light;--bg:#fff;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--hl:#f3f4f6;--bad:#b91c1c;--ph:#2a2d34;--m:20px}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101114;--ink:#e7e8ea;--mut:#9aa0a8;--line:#272a30;--hl:#1b1d22;--bad:#f87171;--ph:#1b1d22}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{max-width:1000px;margin:0 auto;padding:0 max(var(--m),env(safe-area-inset-right)) 0 max(var(--m),env(safe-area-inset-left));background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:break-word}
main{padding-bottom:64px}
button,input,textarea{touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.mut{color:var(--mut)}
a{color:var(--mut);font-size:.88rem;white-space:nowrap}
a:hover{color:var(--ink)}

/* 상단 */
.top{display:flex;justify-content:space-between;align-items:center;min-height:56px}
h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.sub{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cur{padding:12px 2px;margin-bottom:-1px;border-bottom:2px solid var(--ink);font-size:.95rem;font-weight:700}
.tools{display:flex;align-items:center;gap:16px}
.theme{position:relative}
.theme>button{display:grid;place-items:center;width:44px;padding:0}
.themeMenu{position:absolute;right:0;top:100%;z-index:30;min-width:140px;border:1px solid var(--line);background:var(--bg)}
.themeMenu button{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;min-height:44px;padding:0 16px;border:0;border-radius:0;background:none;color:var(--ink);font:inherit;font-size:.88rem;text-align:left;white-space:nowrap;cursor:pointer}
.themeMenu button+button{border-top:1px solid var(--line)}
.themeMenu button[aria-pressed="true"]::after{content:"✓"}
.themeMenu button:hover{background:var(--hl)}
.lead{margin:16px 0 0;font-size:.9rem}
h2{margin:32px 0 8px;font-size:1.05rem;font-weight:700}
.note{margin:0 0 12px;font-size:.82rem}
#msg{min-height:1.6em;margin:12px 0 0;color:var(--mut);font-size:.88rem}

/* 버튼 (모서리 없는 평평한 버튼) */
button{min-height:48px;padding:0 20px;border:0;border-radius:0;background:none;color:var(--ink);font:inherit;font-size:.92rem;font-weight:500;white-space:nowrap;cursor:pointer}
button.solid{background:var(--ink);color:var(--bg)}
button.bad{color:var(--bad)}
button.txt{min-height:44px;padding:0 4px;color:var(--mut);font-size:.88rem}
button.block{display:block;width:100%;min-height:52px;margin-top:12px;border:1px solid var(--line)}
button:disabled{color:var(--mut);cursor:wait}
button.solid:disabled{background:var(--line)}
@media (hover:hover){
  button:hover:not(:disabled):not(.solid):not(.grip):not(.txt){background:var(--hl)}
  button.txt:hover:not(:disabled){color:var(--ink)}
  button.solid:hover:not(:disabled){opacity:.9}
}

/* 로그인 */
.login{display:grid;grid-template-columns:1fr auto;margin-top:16px;border:1px solid var(--line)}
.login input{min-width:0;height:52px;padding:0 16px;border:0;border-right:1px solid var(--line);border-radius:0;background:none;color:var(--ink);font:inherit}
.login input:focus{outline:none;background:var(--hl)}
.login button{height:52px;padding:0 28px}

/* 등록 양식 (칸이 선으로 나뉘고 아래 버튼은 가로로 꽉 참) */
.spec{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.cell{min-width:0;padding:10px 16px 6px;border-bottom:1px solid var(--line)}
.cell:nth-child(odd):not(.full){border-right:1px solid var(--line)}
.cell:focus-within{background:var(--hl)}
.full{grid-column:1/-1}
label{display:block;color:var(--mut);font-size:.78rem}
input,textarea{display:block;width:100%;min-height:36px;padding:4px 0;border:0;border-radius:0;background:none;color:var(--ink);font:inherit}
textarea{resize:vertical}
.cell input:focus,.cell textarea:focus{outline:none}
.hint{margin:0 0 4px;color:var(--mut);font-size:.82rem}
.acts{grid-column:1/-1;display:flex}
.acts button{flex:1;min-height:52px}
.acts button+button{border-left:1px solid var(--line)}

/* 순서 저장 바 */
.order{display:flex;flex-wrap:wrap;align-items:stretch;margin-bottom:12px;border:1px solid var(--line);background:var(--hl)}
.order span{flex:1;min-width:200px;align-self:center;padding:12px 16px;color:var(--mut);font-size:.88rem}
.order button{border-left:1px solid var(--line)}

/* 영화 목록 (수정/삭제는 줄 오른쪽 끝에 붙임) */
ul{margin:0;padding:0;list-style:none}
#rows{border:1px solid var(--line)}
.item{position:relative;display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.drag{z-index:2;background:var(--hl)}
#rows,.item{overflow-anchor:none}
body.dragging{user-select:none;cursor:grabbing}
.imain{display:flex;flex:1;min-width:0;align-items:center;gap:14px;padding:12px 12px 12px 8px}
.thumb{display:block;flex:none;width:44px;aspect-ratio:2/3;border-radius:0;background:var(--ph);object-fit:cover}
.thumb.err{display:grid;place-items:center;border:1px solid var(--bad);background:none;color:var(--bad);font-size:.8rem;font-weight:700}
.meta{display:flex;flex:1;flex-direction:column;min-width:0;font-size:.9rem}
.meta strong{font-size:1rem;overflow-wrap:anywhere}
.idx{flex:none;width:1.4em;text-align:center;font-size:.85rem}
.btns{display:flex;flex:none}
.btns button{min-width:72px;border-left:1px solid var(--line)}
button.grip{display:grid;place-items:center;flex:none;min-width:32px;min-height:44px;padding:0;border-radius:6px;color:var(--mut);cursor:grab;touch-action:none;user-select:none;-webkit-touch-callout:none}
button.grip:disabled{cursor:default;opacity:.4}

@media (max-width:720px){
  .spec{grid-template-columns:1fr}
  .cell:nth-child(odd):not(.full){border-right:0}
}
@media (max-width:520px){
  .order span{flex-basis:100%}
  .order button{flex:1;border-top:1px solid var(--line)}
  .order button:first-of-type{border-left:0}
  .item{flex-wrap:wrap}
  .btns{width:100%;border-top:1px solid var(--line)}
  .btns button{flex:1}
  .btns button:first-child{border-left:0}
}
</style>
</head>
<body>
<header class="top">
  <h1>관리자 대시보드</h1>
  <div class="theme">
        <button class="txt" id="themeBtn" type="button" aria-label="화면 모드" title="화면 모드" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
        <div class="themeMenu" id="themeMenu" role="group" aria-label="화면 모드" hidden>
          <button type="button" data-mode="system">기기 설정</button>
          <button type="button" data-mode="light">라이트</button>
          <button type="button" data-mode="dark">다크</button>
        </div>
      </div>
</header>
<nav class="sub">
  <span class="cur" aria-current="page">영화 관리</span>
  <div class="tools" id="tools" hidden>
    <a href="index.html">예매 페이지 보기</a>
    <button class="txt" id="logoutBtn" type="button">로그아웃</button>
  </div>
</nav>

<main>
  <p class="lead mut">영화 등록과 수정, 반 이름 설정, 예매 명단 내려받기를 할 수 있습니다.</p>

  <form class="login" id="loginForm">
    <input id="pw" type="password" placeholder="관리자 비밀번호" autocomplete="current-password" aria-label="관리자 비밀번호" required>
    <button class="solid">로그인</button>
  </form>
  <p id="msg" role="status"></p>

  <div id="panel" hidden>
    <h2 id="formTitle">영화 등록</h2>
    <form class="spec" id="f">
      <div class="cell"><label for="title">영화 제목</label><input id="title" required maxlength="100"></div>
      <div class="cell"><label for="room">반 이름(상영 장소)</label><input id="room" placeholder="예: 2반 교실" maxlength="50"></div>
      <div class="cell"><label for="start_at">상영 시간</label><input id="start_at" placeholder="예: 12/18 5교시" maxlength="50"></div>
      <div class="cell"><label for="capacity">정원</label><input id="capacity" type="number" min="1" max="500" value="30" required></div>
      <div class="cell full"><label for="poster_url">이미지 링크 (https://로 시작)</label><input id="poster_url" type="url" placeholder="https://..." maxlength="1000"><p class="hint" id="posterHint" aria-live="polite"></p></div>
      <div class="cell full"><label for="description">한 줄 소개</label><textarea id="description" rows="2" maxlength="500"></textarea></div>
      <div class="acts"><button class="solid" id="saveBtn">등록</button><button id="resetBtn" type="button" hidden>수정 취소</button></div>
    </form>

    <h2>등록된 영화</h2>
    <p class="note mut">왼쪽 점 6개 아이콘을 끌어서 순서를 바꾸면 예매 화면에도 같은 순서로 보입니다.</p>
    <div class="order" id="orderBar" hidden>
      <span>순서를 바꿨습니다. 저장해야 예매 화면에 반영됩니다.</span>
      <button class="solid" id="orderSave" type="button">순서 저장</button><button id="orderUndo" type="button">되돌리기</button>
    </div>
    <ul id="rows"></ul>
    <button class="block" id="csvBtn" type="button">예매 명단 CSV 내려받기</button>
  </div>
</main>

<script>
const API = "https://songyang-cgv.pcofjeongchan.workers.dev"; // index.html과 같은 Worker 주소
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FIELDS = ["title", "room", "start_at", "capacity", "poster_url", "description"];
let pw = sessionStorage.getItem("adminPw") || "", data = [], editId = null, dirty = false, saved = []; // 비밀번호는 탭을 닫으면 사라집니다
const say = (t) => ($("#msg").textContent = t);

// 처리 중 모든 버튼 잠금 (중복 클릭 방지)
let busy = false;
async function act(btn, label, fn) {
  if (busy) return;
  busy = true;
  const old = btn.textContent, all = [...document.querySelectorAll("button")];
  all.forEach((b) => (b.disabled = true));
  btn.textContent = label;
  try { await fn(); } catch (e) { say(e.message); }
  all.forEach((b) => (b.disabled = false));
  if (btn.textContent === label) btn.textContent = old;
  busy = false;
}

async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { "Content-Type": "application/json", "X-Admin-Password": pw } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "오류가 발생했습니다.");
  return d;
}
function show(on) { $("#panel").hidden = !on; $("#loginForm").hidden = on; $("#tools").hidden = !on; }
function logout(m = "") { dirty = false; pw = ""; sessionStorage.removeItem("adminPw"); show(false); say(m); }

async function load() {
  try {
    const fresh = (await api("/api/admin/screenings")).screenings;
    saved = fresh.map((s) => s.id); // 서버에 저장된 순서 (되돌리기용)
    if (dirty) { // 순서를 바꾸는 중이면 화면의 순서를 유지
      const pos = new Map(data.map((s, i) => [s.id, i]));
      fresh.sort((a, b) => (pos.get(a.id) ?? 1e9) - (pos.get(b.id) ?? 1e9));
    }
    data = fresh;
    show(true); say("");
    renderRows();
  } catch (e) { logout(e.message); }
}
function renderRows() {
  $("#orderBar").hidden = !dirty;
  $("#rows").innerHTML = data.length ? data.map((s, i) => `<li class="item" data-id="${s.id}">
    <div class="imain">
      <button class="grip" type="button" aria-label="순서 이동 (끌어서 이동, 키보드는 위/아래 방향키)"><svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor" aria-hidden="true"><circle cx="2" cy="2" r="1.6"/><circle cx="8" cy="2" r="1.6"/><circle cx="2" cy="8" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="2" cy="14" r="1.6"/><circle cx="8" cy="14" r="1.6"/></svg></button>
      <span class="idx mut" aria-hidden="true">${i + 1}</span>
      ${s.poster_url ? `<img class="thumb" src="${esc(s.poster_url)}" alt="" referrerpolicy="no-referrer" onerror="imgErr(this)">` : `<span class="thumb"></span>`}
      <div class="meta"><strong>${esc(s.title)}</strong>
        <span class="mut">${esc([s.room, s.start_at].filter(Boolean).join(", ")) || "반, 시간 미정"}</span>
        <span class="mut">예매 ${s.reserved}/${s.capacity}명</span></div></div>
    <div class="btns"><button onclick="edit(${s.id})">수정</button><button class="bad" onclick="del(${s.id}, this)">삭제</button></div></li>`).join("")
    : `<li class="item"><div class="imain mut">아직 등록된 영화가 없습니다. 위 양식으로 첫 영화를 등록하세요.</div></li>`;
}
function imgErr(img) { // 이미지가 안 뜨면 목록에 표시
  const s = document.createElement("span");
  s.className = "thumb err"; s.textContent = "!"; s.title = "이미지를 불러오지 못했습니다";
  img.replaceWith(s);
}
// 순서 변경 (점 6개 아이콘을 끌어서 이동, [순서 저장]을 눌러야 서버에 반영)
let drag = null;
const calm = () => matchMedia("(prefers-reduced-motion:reduce)").matches;
function slide(el, from) { // from(px) 위치에서 제자리로 부드럽게 이동
  if (!from || calm()) return;
  clearTimeout(el._t);
  el.style.transition = "none"; el.style.transform = `translateY(${from}px)`;
  el.getBoundingClientRect();
  el.style.transition = "transform .15s"; el.style.transform = "";
  el._t = setTimeout(() => (el.style.transition = ""), 170); // 끝나면 transition 제거 (끌 때 지연 방지)
}
function flip(el, change) { // 자리가 바뀐 항목이 튀지 않고 이동
  const t0 = el.getBoundingClientRect().top;
  change();
  slide(el, t0 - el.getBoundingClientRect().top);
}
function commit() { // 화면 순서를 data에 반영
  const rows = [...$("#rows").children];
  const ids = rows.map((li) => Number(li.dataset.id));
  if (ids.join() === data.map((s) => s.id).join()) return;
  const by = new Map(data.map((s) => [s.id, s]));
  data = ids.map((id) => by.get(id));
  dirty = true; $("#orderBar").hidden = false;
  rows.forEach((li, k) => (li.querySelector(".idx").textContent = k + 1));
}
const schedule = () => { if (drag && !drag.raf) drag.raf = requestAnimationFrame(dragStep); }; // 움직임이 있을 때만 계산
function dragStep() {
  const d = drag; if (!d) return;
  d.raf = 0;
  const li = d.li, ul = li.parentNode, c = (el) => el.offsetTop + el.offsetHeight / 2; // 애니메이션과 무관한 레이아웃 기준
  const edge = 60, top = d.y < edge, bot = d.y > innerHeight - edge;
  if (top || bot) { // 가장자리에서 자동 스크롤 (가까울수록 빠르게)
    const k = Math.min(1, top ? (edge - d.y) / edge : (d.y - innerHeight + edge) / edge);
    const b = scrollY; scrollBy(0, Math.ceil(k * 14) * (top ? -1 : 1)); d.startY -= scrollY - b;
  }
  for (;;) { // 끄는 줄은 DOM에서 옮기지 않고 옆 줄을 옮김 (옮기면 포인터 캡처가 풀려 드래그가 멈춤)
    const m = c(li) + d.y - d.startY, p = li.previousElementSibling, n = li.nextElementSibling;
    if (p && m < c(p)) { flip(p, () => ul.insertBefore(p, li.nextElementSibling)); d.startY -= p.offsetHeight; }
    else if (n && m > c(n)) { flip(n, () => ul.insertBefore(n, li)); d.startY += n.offsetHeight; }
    else break;
  }
  li.style.transform = `translateY(${d.y - d.startY}px)`;
  if (top || bot) schedule();
}
function onMove(ev) {
  const d = drag; if (!d || ev.pointerId !== d.pid) return;
  if (ev.pointerType === "mouse" && ev.buttons === 0) return endDrag(); // 버튼을 뗐는데 pointerup을 놓친 경우
  d.y = ev.clientY; schedule();
}
function endDrag(ev) {
  const d = drag;
  if (!d || (ev && ev.pointerId !== undefined && ev.pointerId !== d.pid)) return;
  drag = null;
  cancelAnimationFrame(d.raf);
  removeEventListener("pointermove", onMove); removeEventListener("pointerup", endDrag);
  removeEventListener("pointercancel", endDrag); removeEventListener("blur", endDrag);
  const dy = d.y - d.startY;
  d.li.style.transform = "";
  slide(d.li, dy); // 놓은 자리에서 제 자리로 안착
  d.li.classList.remove("drag"); document.body.classList.remove("dragging");
  commit();
}
$("#rows").addEventListener("pointerdown", (e) => {
  const g = e.target.closest(".grip");
  if (!g || busy || drag || e.button > 0) return;
  e.preventDefault();
  const li = g.closest("li");
  clearTimeout(li._t); li.style.transition = "none"; // 이전 이동 효과가 남아 끌림이 지연되지 않도록
  drag = { li, pid: e.pointerId, y: e.clientY, startY: e.clientY, raf: 0 };
  try { g.setPointerCapture(e.pointerId); } catch {}
  addEventListener("pointermove", onMove); addEventListener("pointerup", endDrag);
  addEventListener("pointercancel", endDrag); addEventListener("blur", endDrag);
  li.classList.add("drag"); document.body.classList.add("dragging");
});
$("#rows").addEventListener("contextmenu", (e) => { if (e.target.closest(".grip")) e.preventDefault(); }); // 길게 누를 때 메뉴 방지
$("#rows").addEventListener("keydown", (e) => { // 키보드: 아이콘에 포커스 후 위/아래 방향키
  const g = e.target.closest(".grip");
  if (!g || busy || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
  e.preventDefault();
  const li = g.closest("li"), ul = li.parentNode, up = e.key === "ArrowUp", sib = up ? li.previousElementSibling : li.nextElementSibling;
  if (!sib) return;
  flip(sib, () => ul.insertBefore(sib, up ? li.nextElementSibling : li));
  commit();
});

function resetForm() { editId = null; $("#f").reset(); $("#capacity").value = 30; $("#formTitle").textContent = "영화 등록"; $("#saveBtn").textContent = "등록"; $("#resetBtn").hidden = true; $("#posterHint").textContent = ""; chk++; }
function edit(id) {
  const s = data.find((x) => x.id === id); editId = id;
  FIELDS.forEach((k) => ($("#" + k).value = s[k] ?? ""));
  $("#formTitle").textContent = "영화 수정"; $("#saveBtn").textContent = "저장"; $("#resetBtn").hidden = false; checkPoster();
  scrollTo({ top: 0, behavior: "smooth" });
}
function del(id, btn) {
  const s = data.find((x) => x.id === id);
  if (!confirm(`"${s.title}"을(를) 삭제할까요? 이 영화의 예매 ${s.reserved}건도 함께 삭제됩니다.`)) return;
  act(btn, "삭제 중...", async () => {
    await api("/api/admin/screenings/" + s.id, { method: "DELETE" });
    await load(); say("삭제했습니다.");
  });
}
$("#f").onsubmit = (e) => {
  e.preventDefault();
  const body = JSON.stringify(Object.fromEntries(FIELDS.map((k) => [k, $("#" + k).value])));
  const id = editId;
  act($("#saveBtn"), id ? "저장 중..." : "등록 중...", async () => {
    await api(id ? "/api/admin/screenings/" + id : "/api/admin/screenings", { method: id ? "PUT" : "POST", body });
    resetForm(); await load(); say(id ? "수정했습니다." : "등록했습니다.");
  });
};
$("#resetBtn").onclick = resetForm;

// 이미지 링크 확인 (저장 전에 실제로 불러와지는지 미리 확인)
let chk = 0;
function checkPoster() {
  const u = $("#poster_url").value.trim(), box = $("#posterHint"), n = ++chk;
  if (!u) { box.textContent = ""; return; }
  box.textContent = "이미지 확인 중...";
  const im = new Image();
  im.referrerPolicy = "no-referrer";
  im.onload = () => { if (n === chk) box.textContent = "이미지를 불러왔습니다."; };
  im.onerror = () => { if (n === chk) box.textContent = "이미지를 불러올 수 없습니다. 이미지 파일 자체의 주소(.jpg, .png 등)인지 확인하세요."; };
  im.src = u;
}
$("#poster_url").onchange = checkPoster;

// 순서 저장 / 되돌리기
$("#orderSave").onclick = () => act($("#orderSave"), "저장 중...", async () => {
  await api("/api/admin/screenings/order", { method: "POST", body: JSON.stringify({ ids: data.map((s) => s.id) }) });
  saved = data.map((s) => s.id); dirty = false; renderRows(); say("순서를 저장했습니다.");
});
$("#orderUndo").onclick = () => { // 서버를 다시 읽지 않고 저장된 순서로 복원
  const pos = new Map(saved.map((id, i) => [id, i]));
  data.sort((a, b) => (pos.get(a.id) ?? 1e9) - (pos.get(b.id) ?? 1e9));
  dirty = false; renderRows(); say("저장된 순서로 되돌렸습니다.");
};
addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });
$("#csvBtn").onclick = () => act($("#csvBtn"), "불러오는 중...", async () => {
  const { roster } = await api("/api/admin/roster");
  const t = Object.fromEntries(data.map((s) => [s.id, s]));
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = "영화,반,학번,이름\n" + roster.map((r) => [t[r.screening_id]?.title, t[r.screening_id]?.room, r.student_id, r.name].map(q).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv" })); a.download = "예매명단.csv"; a.click();
});
$("#loginForm").onsubmit = (e) => {
  e.preventDefault();
  act($("#loginForm button"), "로그인 중...", async () => {
    pw = $("#pw").value; $("#pw").value = "";
    await load();
    if (!$("#panel").hidden) sessionStorage.setItem("adminPw", pw);
  });
};
$("#logoutBtn").onclick = () => logout();
// 화면 모드 (기기 설정 / 라이트 / 다크)
const dq = matchMedia("(prefers-color-scheme:dark)"), menu = $("#themeMenu"), tbtn = $("#themeBtn");
function applyTheme() {
  const saved = localStorage.getItem("theme"), m = saved === "light" || saved === "dark" ? saved : "system";
  document.documentElement.dataset.theme = m === "system" ? (dq.matches ? "dark" : "light") : m;
  menu.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === m));
}
const setMenu = (open) => { menu.hidden = !open; tbtn.setAttribute("aria-expanded", open); };
tbtn.onclick = () => { setMenu(menu.hidden); if (!menu.hidden) menu.querySelector('[aria-pressed="true"]').focus(); };
menu.onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.mode === "system") localStorage.removeItem("theme"); else localStorage.setItem("theme", b.dataset.mode);
  applyTheme(); setMenu(false); tbtn.focus();
};
document.addEventListener("click", (e) => { if (!menu.hidden && !e.target.closest(".theme")) setMenu(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !menu.hidden) { setMenu(false); tbtn.focus(); } });
dq.addEventListener("change", applyTheme); // 기기 설정이 바뀌면 자동 반영
applyTheme();

pw ? load() : show(false);
</script>
</body>
</html>
