<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학기말 영화 상영 예매</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script>try{var m=localStorage.getItem("theme");document.documentElement.dataset.theme=m==="dark"||m==="light"?m:matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"}catch(e){}</script>
<style>
:root{color-scheme:light;--bg:#fff;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--hl:#f3f4f6;--ok:#047857;--bad:#b91c1c;--ph:#2a2d34;--w:clamp(168px,56vw,260px);--gap:16px;--m:20px;--dock:56px}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101114;--ink:#e7e8ea;--mut:#9aa0a8;--line:#272a30;--hl:#1b1d22;--ok:#34d399;--bad:#f87171;--ph:#1b1d22}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{max-width:1000px;margin:0 auto;padding:0 max(var(--m),env(safe-area-inset-right)) 0 max(var(--m),env(safe-area-inset-left));background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:break-word}
main{padding-bottom:48px}
body.hasDock main{padding-bottom:calc(var(--dock) + 24px + env(safe-area-inset-bottom))}
button,input{touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.mut{color:var(--mut)}

/* 상단 */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0 12px;min-height:56px}
h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px;font-size:.9rem}
.txt{min-height:44px;padding:0 4px;border:0;background:none;color:var(--mut);font:inherit;font-size:.88rem;white-space:nowrap;cursor:pointer}
.txt:hover{color:var(--ink)}
.topR{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:0 4px}
.theme{position:relative}
.theme>button{display:grid;place-items:center;width:44px;padding:0}
.themeMenu{position:absolute;right:0;top:100%;z-index:30;min-width:140px;border:1px solid var(--line);background:var(--bg)}
.themeMenu button{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;min-height:44px;padding:0 16px;border:0;border-radius:0;background:none;color:var(--ink);font:inherit;font-size:.88rem;text-align:left;white-space:nowrap;cursor:pointer}
.themeMenu button+button{border-top:1px solid var(--line)}
.themeMenu button[aria-pressed="true"]::after{content:"✓"}
.themeMenu button:hover{background:var(--hl)}
.sub{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cur{padding:12px 2px;margin-bottom:-1px;border-bottom:2px solid var(--ink);font-size:.95rem;font-weight:700}
.lead{margin:16px 0 0;font-size:.9rem}
.msg{min-height:1.6em;margin:16px 0 8px;text-align:center;color:var(--mut);font-size:.88rem}

/* 버튼 (모서리 없는 평평한 버튼) */
.pill{display:block;min-height:48px;padding:0 20px;border:0;border-radius:0;background:none;color:var(--ink);font:inherit;font-size:.92rem;font-weight:500;white-space:nowrap;cursor:pointer}
.pill.bad{color:var(--bad)}
.pill:disabled{color:var(--mut);cursor:not-allowed}
.pill.wait:disabled{cursor:wait}

/* 로그인 전용 화면 */
.gate{max-width:360px;margin:0 auto;padding:clamp(40px,14vh,140px) 0 48px}
.gate h2{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.gate .lead{margin:8px 0 24px}
.gform{display:grid;border:0}
.gform input{min-width:0;height:52px;padding:0 2px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;color:var(--ink);font:inherit;transition:border-color .15s}
.gform input::placeholder{color:var(--mut)}
.gform input:focus{outline:none;border-bottom-color:var(--ink);box-shadow:inset 0 -1px 0 var(--ink)}
.gform .pill{width:100%;height:52px;margin-top:28px;background:var(--ink);color:var(--bg)}
.gform .pill:disabled{opacity:.6;color:var(--bg)}
.gate .msg{margin:12px 0 0;color:var(--bad);text-align:left}

/* 하단 예매 바 (좌우 여백을 두고 아래에 띄움) */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);border-top:1px solid var(--line);background:var(--bg);color:var(--ink)}
.dock.primary{border-top-color:var(--ink);background:var(--ink);color:var(--bg)}
.dock.cancel{border-top-color:var(--bad);color:var(--bad)}
.dock.off{color:var(--mut)}
.dock .pill{width:100%;min-height:var(--dock);background:none;color:inherit;font-size:1rem}
.dock.primary .pill:disabled{opacity:.55}

/* 확인창 (작은 팝업이 아래에서 올라옴) */
html.noscroll{overflow:hidden}
.sheetWrap{position:fixed;inset:0;z-index:50;visibility:hidden;transition:visibility 0s .25s}
.sheetWrap.open{visibility:visible;transition:visibility 0s}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);background:var(--bg);transform:translateY(100%);transition:transform .25s}
.open .backdrop{opacity:1}
.open .sheet{transform:none}
.sheetBody{padding:20px 16px 12px}
.sheetQ{margin:0 0 16px;font-weight:700}
.sheetInfo{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sheetInfo .info{flex:1;min-width:0;font-size:.88rem}
.sheetInfo h2{margin:0;font-size:1rem}
.sheetInfo .line{justify-content:flex-start}
.sheetMsg{min-height:1.6em;margin:12px 0 0;color:var(--bad);font-size:.88rem}
.sheetBtns{display:grid;grid-template-columns:1fr 2fr;border-top:1px solid var(--line)}
.sheetBtns .pill{min-height:var(--dock);font-size:1rem}
.sheetBtns .pill:first-child{border-right:1px solid var(--line)}
#sheetOk{background:var(--ink);color:var(--bg)}
#sheetOk.bad{background:var(--bad);color:var(--bg)}
#sheetOk:disabled{background:var(--hl);color:var(--mut)}
#sheetOk.wait:disabled{background:var(--ink);color:var(--bg);opacity:.6}
#sheetOk.bad.wait:disabled{background:var(--bad)}

/* 캐러셀 */
.stage{position:relative;margin-top:8px}
.track{position:relative;display:flex;align-items:flex-start;gap:var(--gap);margin:0;padding:0 0 4px;list-style:none;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track::before,.track::after{content:"";flex:0 0 calc(50% - var(--w) / 2 - var(--gap))}
.slide{flex:0 0 var(--w);scroll-snap-align:center;text-align:center}
.poster{position:relative;display:block;width:100%;min-height:0;aspect-ratio:2/3;padding:0;border:0;border-radius:0;overflow:hidden;background:var(--ph);cursor:pointer;opacity:.5;transform:scale(.84);transform-origin:50% 100%;transition:transform .25s,opacity .25s}
.poster::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.5))}
.on .poster{opacity:1;transform:none;cursor:default}
.poster img,.gp img{display:block;width:100%;height:100%;object-fit:cover}
.ph{display:flex;align-items:center;justify-content:center;height:100%;padding:16px;color:#e7e8ea;font-weight:700;font-size:1.1rem;text-align:center;word-break:keep-all}
.no{position:absolute;left:14px;bottom:8px;z-index:1;color:#fff;font-size:3.5rem;font-weight:700;font-style:italic;line-height:1}
.tag{position:absolute;top:10px;left:10px;z-index:1;padding:2px 8px;border-radius:0;background:var(--ink);color:var(--bg);font-size:.72rem;font-weight:500;line-height:1.6}
.tag.ok{background:var(--ok);color:var(--bg)}
.t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin:14px 0 0;color:var(--mut);font-size:1.05rem;font-weight:700;line-height:1.4;word-break:keep-all;transition:color .25s}
.on .t{color:var(--ink)}
.more{visibility:hidden;margin-top:6px;font-size:.88rem}
.on .more{visibility:visible}
.more p,.info p{margin:2px 0}
.seat{color:var(--mut)}
.seat.low{color:var(--bad)}
.ok{color:var(--ok);font-weight:500}
.desc{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin-top:8px!important;color:var(--mut)}
.line{display:flex;flex-wrap:wrap;justify-content:center;gap:0 14px}
.line span{white-space:nowrap}
.arrow{position:absolute;z-index:2;top:calc(var(--w) * .75);transform:translateY(-50%);display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid var(--mut);border-radius:50%;background:var(--bg);color:var(--ink);cursor:pointer}
#prev{left:0}
#next{right:0}
.arrow:disabled{opacity:.3;cursor:default}
@media (hover:none){.arrow{display:none}}
.count{margin:20px 0 0;text-align:center;font-size:.8rem}
.empty{padding:48px 0;text-align:center}

/* 리스트형 (예매 버튼은 줄 오른쪽 끝에 붙임) */
.rows{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.row{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.rowMain{display:flex;flex:1;min-width:0;align-items:center;gap:16px;padding:16px 12px 16px 0}
.th{flex:none;width:56px;aspect-ratio:2/3;overflow:hidden;background:var(--ph)}
.th img{display:block;width:100%;height:100%;object-fit:cover}
.th .ph{padding:4px;font-size:.7rem}
.row .info{flex:1;min-width:0;font-size:.88rem}
.row h2{margin:0;font-size:1rem;font-weight:700}
.row .line{justify-content:flex-start}
.row .pill{flex:none;min-width:104px;padding:0 0 0 12px;text-align:right}

/* 넓은 화면(PC·태블릿): 캐러셀 대신 카드 그리드, 예매 버튼은 카드 아래에 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:32px 24px;margin:8px 0 0;padding:0;list-style:none}
.card{display:flex;flex-direction:column;min-width:0;text-align:left}
.card .line{justify-content:flex-start}
.gp{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--ph)}
.cbtn{margin-top:auto;padding-top:12px}
.cbtn .pill{width:100%;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.cbtn .pill.bad{border-color:var(--bad);background:none;color:var(--bad)}
.cbtn .pill:disabled{border-color:var(--line);background:none;color:var(--mut)}
@media (min-width:720px){
  body{max-width:1200px;--m:32px}
  main{padding-bottom:64px}
  .th{width:72px}
}
@media (hover:hover){
  .row .pill:hover:not(:disabled),.sheetBtns .pill:first-child:hover:not(:disabled){background:var(--hl)}
  .cbtn .pill:hover:not(:disabled){opacity:.88}
}
@media (max-width:520px){
  .row .pill{min-width:80px}
}
@media (prefers-reduced-motion:reduce){.poster,.t,.backdrop,.sheet{transition:none}}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>학기말 영화 상영</h1>
    <div class="topR">
      <div class="who" id="userBar" hidden>
        <strong id="who"></strong>
        <button class="txt" id="logoutBtn" type="button">로그아웃</button>
      </div>
      <div class="theme">
        <button class="txt" id="themeBtn" type="button" aria-label="화면 모드" title="화면 모드" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
        <div class="themeMenu" id="themeMenu" role="group" aria-label="화면 모드" hidden>
          <button type="button" data-mode="system">기기 설정</button>
          <button type="button" data-mode="light">라이트</button>
          <button type="button" data-mode="dark">다크</button>
        </div>
      </div>
    </div>
  </header>

  <section class="gate" id="gate" hidden>
    <h2>로그인</h2>
    <p class="lead mut">학번과 이름을 입력하면 예매 화면으로 이동합니다.</p>
    <form class="gform" id="loginForm">
      <input id="sid" placeholder="학번" inputmode="numeric" autocomplete="username" aria-label="학번" required>
      <input id="name" placeholder="이름" autocomplete="off" aria-label="이름" required>
      <button class="pill">로그인</button>
    </form>
    <p class="msg" id="gateMsg" role="status"></p>
  </section>

  <div id="app" hidden>
    <nav class="sub">
      <span class="cur" aria-current="page">상영작</span>
      <button class="txt" id="viewBtn" type="button">리스트형</button>
    </nav>

    <p class="lead mut">보고 싶은 영화를 한 편 선택해 예매하세요. 예매 후에도 다른 영화로 바꿀 수 있습니다.</p>

    <p class="msg" id="msg" role="status"></p>
    <div id="view"><p class="empty mut">불러오는 중...</p></div>
  </div>
</main>

<div class="dock" id="dock" hidden></div>

<div class="sheetWrap" id="sheetWrap">
  <div class="backdrop" onclick="closeSheet()"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetQ">
    <div class="sheetBody">
      <p class="sheetQ" id="sheetQ"></p>
      <div class="sheetInfo" id="sheetInfo"></div>
      <p class="sheetMsg" id="sheetMsg" role="alert"></p>
    </div>
    <div class="sheetBtns">
      <button class="pill" type="button" onclick="closeSheet()">닫기</button>
      <button class="pill" id="sheetOk" type="button"></button>
    </div>
  </div>
</div>

<script>
const API = "https://songyang-cgv.pcofjeongchan.workers.dev"; // 배포한 Worker 주소
const TEST_MODE = false; // 로그인 없이 테스트 (운영 때는 false)
const newId = () => "test-" + Math.random().toString(36).slice(2, 7);
let testUser = localStorage.getItem("testUser") || newId();
localStorage.setItem("testUser", testUser);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token = TEST_MODE ? "test" : localStorage.getItem("token");
let items = [], mine = null, cur = 0, first = true, sig = "", shown = "";
let view = localStorage.getItem("view") === "list" ? "list" : "card";
const pc = matchMedia("(min-width:720px)"), lay = () => (view === "list" ? "list" : pc.matches ? "grid" : "card"); // 화면 배치
const smooth = () => (matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth");
const CHEV = (d) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;

// 서버 통신
async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}), ...(TEST_MODE ? { "X-Test-User": testUser } : {}) } });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && token && path !== "/api/login") logout("로그인이 만료되었습니다. 다시 로그인해 주세요.");
  if (!r.ok) throw Object.assign(new Error(d.error || "오류가 발생했습니다."), { status: r.status });
  return d;
}
const say = (t) => (($("#sheetWrap").classList.contains("open") ? $("#sheetMsg") : token ? $("#msg") : $("#gateMsg")).textContent = t); // 확인창이 열려 있으면 그 안에, 로그인 전이면 로그인 화면에 표시

// 로그인 상태
function showUser() {
  $("#gate").hidden = !!token;
  $("#app").hidden = !token;
  $("#userBar").hidden = !token;
  $("#who").textContent = TEST_MODE ? "테스트 학생 " + testUser : (localStorage.getItem("name") || "") + " 학생";
  $("#logoutBtn").textContent = TEST_MODE ? "다른 테스트 학생으로 전환" : "로그아웃";
  if (TEST_MODE) say("테스트 모드입니다. 로그인 없이 예매를 시험할 수 있습니다.");
}
function logout(m = "") { closeSheet(true); ["token", "name", "admin"].forEach((k) => localStorage.removeItem(k)); token = null; mine = null; items = []; first = true; $("#loginForm").reset(); showUser(); sig = ""; draw(); say(m); }

// 공통 조각
const poster = (s) => s.poster_url
  ? `<img src="${esc(s.poster_url)}" alt="${esc(s.title)}" loading="lazy" draggable="false" referrerpolicy="no-referrer" onerror="phFix(this)">`
  : `<span class="ph">${esc(s.title)}</span>`;
function phFix(img) { const p = document.createElement("span"); p.className = "ph"; p.textContent = img.alt; img.replaceWith(p); }
function meta(s) {
  const m = mine === s.id, left = Math.max(s.remaining, 0);
  const loc = [s.room, s.start_at].filter(Boolean).map((x) => `<span>${esc(x)}</span>`).join("");
  return `${loc ? `<p class="line">${loc}</p>` : ""}<p class="line seat${left <= 5 ? " low" : ""}">${m ? `<span class="ok">예매 완료</span>` : ""}<span>남은 자리 ${left}/${s.capacity}</span></p>`;
}
function btn(s) {
  const m = mine === s.id, full = s.remaining <= 0 && !m;
  if (!token) return `<button class="pill" disabled>로그인 필요</button>`;
  if (m) return `<button class="pill bad" onclick="askCancel(this)">예매 취소</button>`;
  return `<button class="pill" ${full ? "disabled" : ""} onclick="ask(${s.id}, this)">${full ? "매진" : mine !== null ? "이 영화로 변경" : "예매하기"}</button>`;
}
const desc = (s) => (s.description ? `<p class="desc">${esc(s.description)}</p>` : "");

// 카드형 (가운데 포커스)
const tagHtml = (s) => (mine === s.id ? `<span class="tag ok">예매 완료</span>` : s.remaining <= 0 ? `<span class="tag">매진</span>` : "");
function slide(s, i) {
  return `<li class="slide${i === cur ? " on" : ""}" data-i="${i}">
    <button class="poster" type="button" onclick="go(${i})" aria-label="${esc(s.title)} 선택">
      ${poster(s)}<span class="tagbox">${tagHtml(s)}</span><b class="no">${i + 1}</b>
    </button>
    <h2 class="t">${esc(s.title)}</h2>
    <div class="more">${meta(s)}${desc(s)}</div></li>`;
}
// 리스트형
function row(s) {
  return `<li class="row"><div class="rowMain"><div class="th">${poster(s)}</div>
    <div class="info"><h2>${esc(s.title)}</h2>${meta(s)}${desc(s)}</div></div>${btn(s)}</li>`;
}

// 그리드형 (넓은 화면)
function card(s) {
  return `<li class="card on"><div class="gp">${poster(s)}<span class="tagbox">${tagHtml(s)}</span></div>
    <h2 class="t">${esc(s.title)}</h2>
    <div class="more">${meta(s)}${desc(s)}</div><div class="cbtn">${btn(s)}</div></li>`;
}

function render() {
  $("#viewBtn").textContent = view === "list" ? "카드형" : "리스트형";
  shown = key();
  const box = $("#view");
  if (!items.length) { box.innerHTML = `<p class="empty mut">아직 등록된 영화가 없습니다. 곧 공개됩니다.</p>`; return; }
  if (lay() === "list") { box.innerHTML = `<ul class="rows">${items.map(row).join("")}</ul>`; return; }
  if (lay() === "grid") { box.innerHTML = `<ul class="grid" id="grid">${items.map(card).join("")}</ul>`; return; }
  cur = Math.min(cur, items.length - 1);
  box.innerHTML = `<div class="stage" role="region" aria-roledescription="carousel" aria-label="상영 영화">
      <button class="arrow" id="prev" type="button" aria-label="이전 영화" onclick="go(cur - 1)">${CHEV("M15 5l-7 7 7 7")}</button>
      <ul class="track" id="track" tabindex="0">${items.map(slide).join("")}</ul>
      <button class="arrow" id="next" type="button" aria-label="다음 영화" onclick="go(cur + 1)">${CHEV("M9 5l7 7-7 7")}</button>
    </div><p class="count mut" id="count"></p>`;
  const t = $("#track");
  t.scrollLeft = left(cur);
  t.addEventListener("scroll", onScroll, { passive: true });
  t.onkeydown = (e) => {
    if (e.key === "ArrowRight") { e.preventDefault(); go(cur + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
  };
  mark();
}

// 캐러셀 위치
function left(i) { const t = $("#track"), el = t.children[i]; return el.offsetLeft + el.offsetWidth / 2 - t.clientWidth / 2; }
function go(i) {
  const t = $("#track"); if (!t) return;
  t.scrollTo({ left: left(Math.max(0, Math.min(i, items.length - 1))), behavior: smooth() });
}
let tick = false;
function onScroll() { if (tick) return; tick = true; requestAnimationFrame(() => { tick = false; mark(); }); }
function mark() {
  const t = $("#track"); if (!t) return;
  const mid = t.scrollLeft + t.clientWidth / 2;
  let best = 0, d = Infinity;
  [...t.children].forEach((el, i) => { const x = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid); if (x < d) { d = x; best = i; } });
  cur = best;
  dock();
  [...t.children].forEach((el, i) => el.classList.toggle("on", i === best));
  $("#prev").disabled = best === 0;
  $("#next").disabled = best === items.length - 1;
  $("#count").textContent = (best + 1) + " / " + items.length;
}

// 하단 고정 예매 바 (가운데 영화 기준)
const dockState = (s) => (!token ? "off" : mine === s.id ? "cancel" : s.remaining <= 0 ? "off" : "primary");
function dock(force) {
  const el = $("#dock"), s = lay() === "card" ? items[cur] : null;
  el.hidden = !s;
  document.body.classList.toggle("hasDock", !!s);
  if (!s) return;
  const html = btn(s), k = dockState(s) + html;
  if (!force && el.dataset.k === k) return; // 스크롤 중 불필요한 갱신 방지
  el.dataset.k = k; el.className = "dock " + dockState(s); el.innerHTML = html;
}

// 데이터 갱신 (바뀐 게 없으면 다시 그리지 않음)
const key = () => lay() + JSON.stringify(items.map(({ remaining, ...r }) => r)); // 남은 자리 외 정보
function patch() { // 영화 목록이 같으면 화면을 새로 만들지 않고 내용만 갱신 (애니메이션·깜빡임 방지)
  const box = $("#track") || $("#grid"), els = box ? box.children : document.querySelectorAll(".rows .row");
  items.forEach((s, i) => {
    const el = els[i];
    if (box) {
      el.querySelector(".tagbox").innerHTML = tagHtml(s);
      el.querySelector(".more").innerHTML = meta(s) + desc(s);
      if (box.id === "grid") el.querySelector(".cbtn").innerHTML = btn(s);
    } else {
      el.querySelector(".info").innerHTML = `<h2>${esc(s.title)}</h2>${meta(s)}${desc(s)}`;
      el.querySelector(".pill").outerHTML = btn(s);
    }
  });
}
function draw() {
  const s = JSON.stringify([items, mine, lay(), !!token]);
  if (s === sig) return;
  sig = s;
  if (items.length && shown === key() && $("#track, #grid, .rows")) patch(); else render();
  dock(true);
}
async function load() {
  const d = await api("/api/screenings");
  items = d.screenings; mine = d.mine;
  if (first) { first = false; cur = Math.max(items.findIndex((s) => s.id === mine), 0); } // 처음엔 내 예매 영화를 가운데로
  draw();
}
// 처리 중 버튼 잠금 (중복 클릭 방지)
let busy = false;
async function act(btn, label, fn, keep) {
  if (busy) return;
  busy = true;
  const old = btn.textContent;
  document.querySelectorAll(".pill").forEach((b) => (b.disabled = true));
  btn.textContent = label; btn.classList.add("wait");
  let ok = true;
  try { await fn(); } catch (e) { ok = false; say(e.message); }
  busy = false; sig = "";
  draw(); // 서버를 다시 읽지 않고 화면의 값으로 갱신
  if (ok && keep) return; // 확인창은 닫히는 중이라 글자를 되돌리지 않음
  btn.textContent = old; btn.classList.remove("wait"); btn.disabled = false;
}

const bump = (id, n) => { const t = items.find((x) => x.id === id); if (t) t.remaining += n; }; // 정원 표시를 직접 증감

// 확인창 (아래에서 올라옴)
let sheetFrom = null;
function openSheet(type, id, from) {
  const s = items.find((x) => x.id === id), prev = items.find((x) => x.id === mine);
  if (!s || busy) return;
  const C = {
    reserve: ["이 영화를 예매할까요?", "예매하기", "예매 중...", "예매가 완료되었습니다."],
    change: [`'${prev ? prev.title : ""}' 예매가 이 영화로 변경됩니다.`, "이 영화로 변경", "변경 중...", "예매를 변경했습니다."],
    cancel: ["예매를 취소할까요?", "예매 취소", "취소 중...", "예매를 취소했습니다."],
  }[type];
  sheetFrom = from;
  $("#sheetQ").textContent = C[0];
  $("#sheetInfo").innerHTML = `<div class="th">${poster(s)}</div><div class="info"><h2>${esc(s.title)}</h2>${meta(s)}</div>`;
  $("#sheetMsg").textContent = "";
  const ok = $("#sheetOk");
  document.querySelectorAll(".sheetBtns .pill").forEach((b) => (b.disabled = false));
  ok.textContent = C[1]; ok.classList.remove("wait"); ok.classList.toggle("bad", type === "cancel");
  ok.onclick = async () => {
    let sold = false;
    await act(ok, C[2], async () => {
      try {
        if (type === "cancel") { await api("/api/reserve", { method: "DELETE" }); bump(mine, 1); mine = null; }
        else { await api("/api/reserve", { method: "POST", body: JSON.stringify({ screeningId: id }) }); bump(mine, 1); bump(id, -1); mine = id; }
      } catch (e) { if (e.status === 409) { sold = true; s.remaining = 0; } throw e; } // 매진이면 화면에도 매진 표시
      closeSheet(true);
      say(C[3]);
    }, true);
    if (sold) ok.disabled = true;
  };
  $("main").inert = true; $("#dock").inert = true;
  document.documentElement.classList.add("noscroll");
  $("#sheetWrap").classList.add("open");
  ok.focus();
}
function closeSheet(force) {
  if (busy && !force) return;
  $("#sheetWrap").classList.remove("open");
  document.documentElement.classList.remove("noscroll");
  $("main").inert = false; $("#dock").inert = false;
  if (sheetFrom && sheetFrom.isConnected) sheetFrom.focus();
  sheetFrom = null;
}
const ask = (id, el) => openSheet(mine !== null ? "change" : "reserve", id, el);
const askCancel = (el) => openSheet("cancel", mine, el);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

// 화면 모드 (기기 설정 / 라이트 / 다크)
const dq = matchMedia("(prefers-color-scheme:dark)"), menu = $("#themeMenu"), tbtn = $("#themeBtn");
function applyTheme() {
  const saved = localStorage.getItem("theme"), m = saved === "light" || saved === "dark" ? saved : "system";
  document.documentElement.dataset.theme = m === "system" ? (dq.matches ? "dark" : "light") : m;
  menu.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === m));
}
const setMenu = (open) => { menu.hidden = !open; tbtn.setAttribute("aria-expanded", open); };
tbtn.onclick = () => { setMenu(menu.hidden); if (!menu.hidden) menu.querySelector('[aria-pressed="true"]').focus(); };
menu.onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.mode === "system") localStorage.removeItem("theme"); else localStorage.setItem("theme", b.dataset.mode);
  applyTheme(); setMenu(false); tbtn.focus();
};
document.addEventListener("click", (e) => { if (!menu.hidden && !e.target.closest(".theme")) setMenu(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !menu.hidden) { setMenu(false); tbtn.focus(); } });
dq.addEventListener("change", applyTheme); // 기기 설정이 바뀌면 자동 반영
applyTheme();

// 이벤트
$("#viewBtn").onclick = () => { view = view === "list" ? "card" : "list"; localStorage.setItem("view", view); draw(); };
$("#loginForm").onsubmit = (e) => {
  e.preventDefault();
  act($("#loginForm button"), "로그인 중...", async () => {
    const d = await api("/api/login", { method: "POST", body: JSON.stringify({ studentId: $("#sid").value, name: $("#name").value }) });
    token = d.token;
    try { await load(); } catch (e) { token = null; throw e; } // 목록을 받아온 뒤에 예매 화면으로 전환
    localStorage.setItem("token", token); localStorage.setItem("name", d.name);
    showUser(); say("");
  });
};
$("#logoutBtn").onclick = () => {
  if (!TEST_MODE) return logout();
  testUser = newId(); localStorage.setItem("testUser", testUser); mine = null; showUser(); sig = ""; draw(); // 새 학생인 척 전환
};
pc.addEventListener("change", () => { sig = ""; draw(); }); // 창 크기에 따라 배치 전환
showUser();
if (token) load().catch((e) => { if (!token) return; say(e.message); $("#view").innerHTML = `<p class="empty mut">불러오지 못했습니다. 새로고침해 주세요.</p>`; }); // 정원은 새로고침해야 다시 불러옴
</script>
</body>
</html>
